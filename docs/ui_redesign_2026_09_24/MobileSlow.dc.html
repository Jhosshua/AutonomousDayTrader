<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day Trader, phone, slow trades</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#F7F3EC}</style>
</helmet>
<div style="width: 390px; height: 2720px; background: #F7F3EC">
<dc-import name="Mobile" start-tab="slow" root-height="{{h}}" hint-size="390px,2720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2720}}'>
class Component extends DCLogic {
  renderVals() { return { h: 2720 }; }
}
</script>
</body>
</html>
