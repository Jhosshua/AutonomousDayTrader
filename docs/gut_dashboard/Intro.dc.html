<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cobalt Ledger animated intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Instrument+Sans:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B4BFF}a:hover{color:#1A33C8}
/* Plays once, 1.2 s total, then the home screen is underneath. Press Play (or reload) to watch it again. */
@keyframes mark{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes ring{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
@keyframes arrow{0%{stroke-dashoffset:40;opacity:0}20%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes word{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes wash{0%{opacity:0}100%{opacity:1}}
.m{animation:mark .3s cubic-bezier(.2,.9,.2,1.2) both}
.ring{stroke-dasharray:60;animation:ring .35s ease-out .05s both}
.arrow{stroke-dasharray:40;animation:arrow .3s ease-out .3s both}
.dot{animation:pop .28s cubic-bezier(.2,.9,.2,1.3) both}
.word{animation:word .3s cubic-bezier(.2,.8,.2,1) .35s both}
.sub{animation:wash .25s ease-out .55s both}
.wash{animation:wash .3s ease-in .9s both}
@media (prefers-reduced-motion:reduce){.m,.ring,.arrow,.dot,.word,.sub{animation:none}.wash{animation:none;opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B4BFF; color: #fff; font-family: 'Instrument Sans', sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">

    <div class="m" style="width: 132px; height: 132px; border-radius: 36px; background: #2B4BFF; border: 3px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 60px rgba(0,0,0,.3)">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="ring" d="M21 12a9 9 0 1 1-9-9" stroke="#fff"></path>
        <path class="arrow" d="M7.5 15l3.5-3.5 2.5 2L20 4M15.5 4H20v4.5" stroke="#C6F432"></path>
      </svg>
    </div>

    <div style="display: flex; gap: 10px; align-items: center" aria-hidden="true">
      <span class="dot" style="animation-delay: .20s; width: 14px; height: 14px; border-radius: 50%; background: #E85A1B; display: block"></span>
      <span class="dot" style="animation-delay: .23s; width: 14px; height: 14px; border-radius: 50%; background: #5FD3C6; display: block"></span>
      <span class="dot" style="animation-delay: .26s; width: 14px; height: 14px; border-radius: 50%; background: #FF6FB0; display: block"></span>
      <span class="dot" style="animation-delay: .29s; width: 14px; height: 14px; border-radius: 50%; background: #B38CFF; display: block"></span>
      <span class="dot" style="animation-delay: .32s; width: 14px; height: 14px; border-radius: 50%; background: #C6F432; display: block"></span>
      <span class="dot" style="animation-delay: .35s; width: 14px; height: 14px; border-radius: 50%; background: #F5B700; display: block"></span>
      <span class="dot" style="animation-delay: .38s; width: 14px; height: 14px; border-radius: 50%; background: #fff; display: block"></span>
    </div>

    <div class="word" style="font: 800 34px 'Bricolage Grotesque', sans-serif; letter-spacing: -.02em">Cobalt Ledger</div>
    <div class="sub" style="font-size: 15px; font-weight: 500; opacity: .85; margin-top: -14px">7 playbooks · 1 practice account</div>

    <div class="wash" style="position: absolute; inset: 0; background: #F4F5FA; display: flex; align-items: center; justify-content: center; color: #5B6180; font-size: 14px; pointer-events: none">Home screen is here at 1.2 s</div>
  </div>
  <a href="Main.dc.html" style="position: absolute; right: 16px; top: 54px; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; background: rgba(0,0,0,.25); border-radius: 999px; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">Skip</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
