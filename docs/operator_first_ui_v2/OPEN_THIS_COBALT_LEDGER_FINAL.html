}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;cobalt-ledger-review&quot;&gt;
  &lt;style&gt;
    #cobalt-ledger-review {
      --cobalt-accent: #2b4bff;

      --cobalt-negative: #c53b22;
      --cobalt-negative-soft: #fff0eb;
      --cobalt-warning: #9c5a00;
      --cobalt-warning-soft: #fff3d8;
      --cobalt-radius: 8px;
      width: 100%;
      color-scheme: light;
      color: var(--cobalt-ink);
      font-family: &quot;Instrument Sans&quot;, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    }

    #cobalt-ledger-review,
    #cobalt-ledger-review * {
      box-sizing: border-box;
    }

    #cobalt-ledger-review button,
    #cobalt-ledger-review select {
      font: inherit;
    }

    #cobalt-ledger-review button {
      cursor: pointer;
    }

    #cobalt-ledger-review .cobalt-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #cobalt-ledger-review .cobalt-review-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px;

      border-radius: 12px;
      background: light-dark(#ffffff, #121a2b);
      color: light-dark(#111932, #f4f7ff);

    #cobalt-ledger-review .cobalt-review-group {

      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: light-dark(#edf1f7, #0b1120);
    }

    #cobalt-ledger-review .cobalt-review-options button {
      min-width: 54px;
      min-height: 40px;
      border: 0;

      background: transparent;
      color: inherit;
      font-size: 13px;
      font-weight: 500;

    #cobalt-ledger-review .cobalt-review-options button[aria-pressed=&quot;true&quot;] {

      color: #ffffff;
    }

    #cobalt-ledger-review .cobalt-review-note {

    #cobalt-ledger-review .cobalt-preview-stage {
      width: 100%;
      padding: 14px;
      overflow: hidden;
      border-radius: 16px;
      background: light-dark(#dfe5f0, #080d18);
    }

    #cobalt-ledger-review .cobalt-app {
      width: min(100%, 1380px);
      margin: 0 auto;
      overflow: hidden;

      border-radius: 12px;

      box-shadow: 0 18px 55px rgba(33, 47, 88, 0.13);
      transition: width 200ms ease, border-radius 200ms ease;

    #cobalt-ledger-review .cobalt-app-header {

      grid-template-columns: minmax(210px, 1fr) auto auto;
      align-items: center;

      min-height: 62px;

    #cobalt-ledger-review .cobalt-brand-copy strong,

    #cobalt-ledger-review .cobalt-brand-copy strong {

      font-size: 17px;

      function formatAxis(value, compact) {
        const sign = value &lt; 0 ? &quot;−&quot; : &quot;&quot;;
        if (compact &amp;&amp; Math.abs(value) &gt;= 1000) return `${sign}$${(Math.abs(value) / 1000).toFixed(1)}k`;
        return `${sign}${money(Math.abs(value))}`;
      }

      function sampleCoordinates(coords, count) {
        if (coords.length === count) return coords;
        const out = [];
        for (let i = 0; i &lt; count; i += 1) {
          const position = (i / Math.max(1, count - 1)) * (coords.length - 1);
          const left = Math.floor(position);
          const right = Math.min(coords.length - 1, Math.ceil(position));
          const mix = position - left;
          out.push({
            x: coords[left].x + (coords[right].x - coords[left].x) * mix,
            y: coords[left].y + (coords[right].y - coords[left].y) * mix
          });
        }
        return out;
      }

      function pathFrom(coords) {
        return coords.map((point, index) =&gt; `${index === 0 ? &quot;M&quot; : &quot;L&quot;}${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(&quot; &quot;);
      }

      function areaFrom(coords, baseline) {
        if (!coords.length) return &quot;&quot;;
        return `${pathFrom(coords)} L${coords[coords.length - 1].x.toFixed(2)},${baseline.toFixed(2)} L${coords[0].x.toFixed(2)},${baseline.toFixed(2)} Z`;
      }

      function drawChart(svg, data) {
        const width = Math.max(320, svg.parentElement.getBoundingClientRect().width);
        const height = stage.classList.contains(&quot;cobalt-phone-preview&quot;) ? 204 : 216;
        const margin = { top: 18, right: 22, bottom: 42, left: width &lt; 430 ? 54 : 68 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const values = data.points.map((point) =&gt; point.value);
        let min = Math.min(...values);
        let max = Math.max(...values);
        const spread = Math.max(1, max - min);
        min -= spread * 0.16;
        max += spread * 0.16;
        if (data === periods.day) {
          min = Math.min(min, 0);
          max = Math.max(max, 0);
        }
        const x = (index) =&gt; margin.left + (index / Math.max(1, data.points.length - 1)) * innerW;
        const y = (value) =&gt; margin.top + ((max - value) / Math.max(1, max - min)) * innerH;
        const coords = data.points.map((point, index) =&gt; ({ x: x(index), y: y(point.value), point }));
        const zeroY = y(data === periods.day ? 0 : min);
        svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
        svg.setAttribute(&quot;aria-label&quot;, `${data.chartHeading}. ${data.points[0].label} ${formatAxis(data.points[0].value, false)}. ${data.points[data.points.length - 1].label} ${formatAxis(data.points[data.points.length - 1].value, false)}.`);
        const description = svg.querySelector(&quot;desc&quot;);
        if (description) description.textContent = svg.getAttribute(&quot;aria-label&quot;);

        const grid = svg.querySelector(&quot;[data-chart-grid]&quot;);
        const ticks = [max, (max + min) / 2, min];
        grid.innerHTML = ticks.map((tick) =&gt; {
          const tickY = y(tick);
          return `&lt;line class=&quot;cobalt-chart-grid&quot; x1=&quot;${margin.left}&quot; y1=&quot;${tickY}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${tickY}&quot;&gt;&lt;/line&gt;&lt;text x=&quot;${margin.left - 8}&quot; y=&quot;${tickY + 4}&quot; text-anchor=&quot;end&quot;&gt;${formatAxis(tick, width &lt; 430)}&lt;/text&gt;`;
        }).join(&quot;&quot;) + (data === periods.day ? `&lt;line class=&quot;cobalt-chart-zero&quot; x1=&quot;${margin.left}&quot; y1=&quot;${y(0)}&quot; x2=&quot;${width - margin.right}&quot; y2=&quot;${y(0)}&quot;&gt;&lt;/line&gt;` : &quot;&quot;);

        const labels = svg.querySelector(&quot;[data-chart-labels]&quot;);
        const maxLabels = width &lt; 430 ? 4 : 6;
        const labelIndexes = new Set();
        const labelCount = Math.min(maxLabels, data.points.length);
        for (let slot = 0; slot &lt; labelCount; slot += 1) {
          labelIndexes.add(Math.round((slot / Math.max(1, labelCount - 1)) * (data.points.length - 1)));
        }
        labels.innerHTML = data.points.map((point, index) =&gt; {
          const show = labelIndexes.has(index);
          if (!show) return &quot;&quot;;
          const anchor = index === 0 ? &quot;start&quot; : index === data.points.length - 1 ? &quot;end&quot; : &quot;middle&quot;;
          return `&lt;text x=&quot;${x(index)}&quot; y=&quot;${height - 19}&quot; text-anchor=&quot;${anchor}&quot;&gt;${point.label}&lt;/text&gt;`;
        }).join(&quot;&quot;) + `&lt;text class=&quot;cobalt-chart-end&quot; x=&quot;${coords[coords.length - 1].x}&quot; y=&quot;${Math.max(14, coords[coords.length - 1].y - 10)}&quot; text-anchor=&quot;end&quot;&gt;${formatAxis(data.points[data.points.length - 1].value, width &lt; 430)}&lt;/text&gt;`;

        const pointGroup = svg.querySelector(&quot;[data-chart-points]&quot;);
        pointGroup.innerHTML = coords.map((coord) =&gt; `&lt;circle class=&quot;cobalt-chart-point&quot; cx=&quot;${coord.x}&quot; cy=&quot;${coord.y}&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;`).join(&quot;&quot;);

        const hit = svg.querySelector(&quot;[data-chart-hit]&quot;);
        hit.setAttribute(&quot;x&quot;, String(margin.left));
        hit.setAttribute(&quot;y&quot;, String(margin.top));
        hit.setAttribute(&quot;width&quot;, String(innerW));
        hit.setAttribute(&quot;height&quot;, String(innerH));
        const guide = svg.querySelector(&quot;[data-chart-guide]&quot;);
        guide.setAttribute(&quot;y1&quot;, String(margin.top));
        guide.setAttribute(&quot;y2&quot;, String(margin.top + innerH));
        svg.querySelector(&#x27;[data-axis=&quot;y&quot;]&#x27;).setAttribute(&quot;transform&quot;, `translate(14 ${margin.top + innerH / 2}) rotate(-90)`);
        svg.querySelector(&#x27;[data-axis=&quot;x&quot;]&#x27;).setAttribute(&quot;x&quot;, String(margin.left + innerW / 2));
        svg.querySelector(&#x27;[data-axis=&quot;x&quot;]&#x27;).setAttribute(&quot;y&quot;, String(height - 2));
        svg.querySelector(&#x27;[data-axis=&quot;x&quot;]&#x27;).setAttribute(&quot;text-anchor&quot;, &quot;middle&quot;);
        svg.querySelector(&#x27;[data-axis=&quot;y&quot;]&#x27;).textContent = data.yAxis;
        svg.querySelector(&#x27;[data-axis=&quot;x&quot;]&#x27;).textContent = data.xAxis;

        const line = svg.querySelector(&quot;[data-chart-line]&quot;);
        const area = svg.querySelector(&quot;[data-chart-area]&quot;);
        const old = chartStates.get(svg);
        const reduced = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
        const target = sampleCoordinates(coords, 24);
        const finish = () =&gt; {
          line.setAttribute(&quot;d&quot;, pathFrom(target));
          area.setAttribute(&quot;d&quot;, areaFrom(target, data === periods.day ? y(0) : margin.top + innerH));
          chartStates.set(svg, target);
        };
        if (!old || reduced) {
          finish();
        } else {
          const start = sampleCoordinates(old, 24);
          const begun = performance.now();
          const animate = (now) =&gt; {
            const progress = Math.min(1, (now - begun) / 200);
            const eased = 1 - Math.pow(1 - progress, 3);
            const frame = target.map((point, index) =&gt; ({
              x: start[index].x + (point.x - start[index].x) * eased,
              y: start[index].y + (point.y - start[index].y) * eased
            }));
            line.setAttribute(&quot;d&quot;, pathFrom(frame));
            area.setAttribute(&quot;d&quot;, areaFrom(frame, data === periods.day ? y(0) : margin.top + innerH));
            if (progress &lt; 1) requestAnimationFrame(animate);
            else chartStates.set(svg, target);
          };
          requestAnimationFrame(animate);
        }

        const tooltip = svg.parentElement.querySelector(&quot;[data-chart-tooltip]&quot;);
        const explore = (event) =&gt; {
          const rect = svg.getBoundingClientRect();
          const localX = ((event.clientX - rect.left) / rect.width) * width;
          let nearest = coords[0];
          coords.forEach((coord) =&gt; {
            if (Math.abs(coord.x - localX) &lt; Math.abs(nearest.x - localX)) nearest = coord;
          });
          guide.style.display = &quot;block&quot;;
          guide.setAttribute(&quot;x1&quot;, String(nearest.x));
          guide.setAttribute(&quot;x2&quot;, String(nearest.x));
          tooltip.innerHTML = `&lt;strong&gt;${nearest.point.label}&lt;/strong&gt;${formatAxis(nearest.point.value, false)}`;
          tooltip.style.left = `${(nearest.x / width) * 100}%`;
          tooltip.style.top = `${(nearest.y / height) * 100}%`;
          tooltip.classList.add(&quot;cobalt-tooltip-visible&quot;);
        };
        hit.onpointermove = explore;
        hit.onpointerdown = explore;
        hit.onpointerleave = () =&gt; {
          guide.style.display = &quot;none&quot;;
          tooltip.classList.remove(&quot;cobalt-tooltip-visible&quot;);
        };
      }

      function setState(name) {
        stage.dataset.state = name;
        root.querySelectorAll(&quot;[data-review-state]&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, button.dataset.reviewState === name ? &quot;true&quot; : &quot;false&quot;);
        });
      }

      function setViewport(name) {
        stage.dataset.viewport = name;
        stage.classList.toggle(&quot;cobalt-phone-preview&quot;, name === &quot;phone&quot;);
        root.querySelectorAll(&quot;[data-review-viewport]&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, button.dataset.reviewViewport === name ? &quot;true&quot; : &quot;false&quot;);
        });
        requestAnimationFrame(() =&gt; {
          root.querySelectorAll(&quot;[data-performance-chart], [data-history-chart]&quot;).forEach((svg) =&gt; drawChart(svg, periods[currentPeriod]));
        });
      }

      function selectHolding(button) {
        root.querySelectorAll(&quot;[data-holding]&quot;).forEach((row) =&gt; {
          const selected = row === button;
          row.setAttribute(&quot;aria-pressed&quot;, selected ? &quot;true&quot; : &quot;false&quot;);
          row.lastElementChild.textContent = selected ? &quot;⌄&quot; : &quot;›&quot;;
        });
        const detail = root.querySelector(&quot;[data-holding-detail]&quot;);
        const mapping = {
          &quot;[data-detail-company]&quot;: button.dataset.company,
          &quot;[data-detail-symbol]&quot;: button.dataset.symbol,
          &quot;[data-detail-entry]&quot;: button.dataset.entry,
          &quot;[data-detail-protection]&quot;: button.dataset.protection,
          &quot;[data-detail-sale]&quot;: button.dataset.sale,
          &quot;[data-detail-plan]&quot;: button.dataset.plan,
          &quot;[data-detail-result]&quot;: button.dataset.result
        };
        Object.entries(mapping).forEach(([selector, value]) =&gt; {
          const target = detail.querySelector(selector);
          if (target) target.textContent = value;
        });
        detail.classList.remove(&quot;cobalt-open&quot;);
        void detail.offsetWidth;
        detail.classList.add(&quot;cobalt-open&quot;);
      }

      function handleMockAction(button) {
        const label = button.dataset.actionLabel || button.textContent.trim();
        const result = button.parentElement.querySelector(&quot;.cobalt-action-result&quot;);
        const confirm = button.dataset.confirm === &quot;true&quot;;
        const phase = button.dataset.phase || &quot;idle&quot;;
        if (confirm &amp;&amp; phase === &quot;idle&quot;) {
          button.dataset.phase = &quot;confirm&quot;;
          button.classList.add(&quot;cobalt-action-danger&quot;);
          button.textContent = &quot;Tap again to confirm&quot;;
          window.setTimeout(() =&gt; {
            if (button.dataset.phase === &quot;confirm&quot;) {
              button.dataset.phase = &quot;idle&quot;;
              button.classList.remove(&quot;cobalt-action-danger&quot;);
              button.textContent = label;
            }
          }, 4000);
          return;
        }
        button.dataset.phase = &quot;sending&quot;;
        button.disabled = true;
        button.classList.remove(&quot;cobalt-action-danger&quot;);
        button.textContent = &quot;Sent, checking&quot;;
        if (result) result.textContent = &quot;Waiting for a fresh update&quot;;
        window.setTimeout(() =&gt; {
          button.dataset.phase = &quot;done&quot;;
          button.textContent = &quot;Confirmed&quot;;
          if (result) result.textContent = &quot;The new state was verified&quot;;
          window.setTimeout(() =&gt; {
            button.dataset.phase = &quot;idle&quot;;
            button.disabled = false;
            button.textContent = label;
            if (result) result.textContent = &quot;&quot;;
          }, 1800);
        }, 900);
      }

      root.addEventListener(&quot;click&quot;, (event) =&gt; {
        const target = event.target;
        const reviewPage = target.closest(&quot;[data-review-page]&quot;);
        if (reviewPage) {
          setPage(reviewPage.dataset.reviewPage);
          return;
        }
        const reviewState = target.closest(&quot;[data-review-state]&quot;);
        if (reviewState) {
          setState(reviewState.dataset.reviewState);
          return;
        }
        const reviewViewport = target.closest(&quot;[data-review-viewport]&quot;);
        if (reviewViewport) {
          setViewport(reviewViewport.dataset.reviewViewport);
          return;
        }
        const appPage = target.closest(&quot;[data-app-page]&quot;);
        if (appPage) {
          setPage(appPage.dataset.appPage);
          return;
        }
        const period = target.closest(&quot;[data-period]&quot;);
        if (period) {
          selectPeriod(period.dataset.period);
          return;
        }
        const breakdown = target.closest(&quot;[data-breakdown]&quot;);
        if (breakdown) {
          setBreakdown(breakdown.dataset.breakdown);
          return;
        }
        const holding = target.closest(&quot;[data-holding]&quot;);
        if (holding) {
          selectHolding(holding);
          return;
        }
        const recentDay = target.closest(&quot;[data-recent-day]&quot;);
        if (recentDay) {
          selectedHistoryKey = recentDay.dataset.recentDay;
          renderRecentHistory();
          return;
        }
        const breakdownRow = target.closest(&quot;[data-breakdown-key]&quot;);
        if (breakdownRow) {
          root.querySelectorAll(&quot;[data-breakdown-key]&quot;).forEach((row) =&gt; row.setAttribute(&quot;aria-pressed&quot;, row === breakdownRow ? &quot;true&quot; : &quot;false&quot;));
          const selected = breakdownData().find((row) =&gt; row.key === breakdownRow.dataset.breakdownKey);
          renderHistoryDrawer(selected);
          return;
        }
        const action = target.closest(&quot;[data-mock-action]&quot;);
        if (action) handleMockAction(action);
      });

      renderRecentHistory();
      renderBreakdown();
      applyPreferences();
      selectPeriod(&quot;day&quot;, false);

      const observer = new ResizeObserver(() =&gt; {
        root.querySelectorAll(&quot;[data-performance-chart], [data-history-chart]&quot;).forEach((svg) =&gt; drawChart(svg, periods[currentPeriod]));
      });
      root.querySelectorAll(&quot;.cobalt-chart-wrap&quot;).forEach((wrap) =&gt; observer.observe(wrap));

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: app, onChange: applyPreferences });
        tweak.addSlider(prefs, &quot;radius&quot;, { label: &quot;Surface radius&quot;, min: 4, max: 16, unit: &quot;px&quot;, reference: &quot;--cobalt-radius&quot; });
        tweak.addColorPicker(prefs, &quot;accent&quot;, { label: &quot;Product accent&quot;, reference: &quot;--cobalt-accent&quot; });
        tweak.addToggle(prefs, &quot;compact&quot;, { label: &quot;Compact spacing&quot;, reference: &quot;cobalt.compact&quot; });
        tweak.addToggle(prefs, &quot;chartFill&quot;, { label: &quot;Chart area fill&quot;, reference: &quot;cobalt.chartFill&quot; });
      }
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
